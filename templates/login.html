<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khóa Bảo Mật - Quản Lý Doanh Thu & Hoa Hồng 4%</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
        .pin-dot {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pin-dot.filled {
            background-color: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
            transform: scale(1.15);
        }
        .numpad-btn:active {
            transform: scale(0.92);
            background-color: #334155 !important;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">
    <!-- Background glow accents -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-sm relative z-10">
        <!-- Brand Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-white shadow-lg shadow-emerald-500/20 mb-3">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Xác Thực Truy Cập</h1>
            <p class="text-xs text-slate-400 mt-1">Sổ Doanh Thu & Hoa Hồng Cá Nhân 4%</p>
        </div>

        <!-- Card Container -->
        <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-2xl shadow-black/60">
            <!-- Form -->
            <form id="pinForm" method="POST" action="/login" class="space-y-6">
                <!-- Hidden Real Input -->
                <input type="password" id="pinInput" name="pin" maxlength="4" autocomplete="off" class="opacity-0 absolute pointer-events-none" />

                <!-- PIN Display Dots -->
                <div class="flex justify-center items-center gap-4 py-2" id="dotsContainer">
                    <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-slate-800/80" data-idx="0"></div>
                    <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-slate-800/80" data-idx="1"></div>
                    <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-slate-800/80" data-idx="2"></div>
                    <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-slate-800/80" data-idx="3"></div>
                </div>

                <!-- Error Message Alert -->
                {% if error %}
                <div id="errorBox" class="bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs text-center rounded-xl py-2 px-3 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <!-- Touch Numeric Keypad -->
                <div class="grid grid-cols-3 gap-3 pt-2">
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('1')">1</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('2')">2</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('3')">3</button>

                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('4')">4</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('5')">5</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('6')">6</button>

                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('7')">7</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('8')">8</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('9')">9</button>

                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-rose-500/20 text-rose-400 text-sm font-semibold transition-all border border-slate-800" onclick="clearPin()">Xóa hết</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-xl font-bold text-white transition-all shadow-sm border border-slate-700/50" onclick="pressKey('0')">0</button>
                    <button type="button" class="numpad-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/60 text-slate-300 text-lg transition-all border border-slate-800 flex items-center justify-center" onclick="backspacePin()">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </div>

                <div class="text-center pt-1">
                    <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-semibold rounded-2xl shadow-lg shadow-emerald-500/25 transition duration-200 flex items-center justify-center gap-2">
                        <span>Mở Khóa Hệ Thống</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-6 text-slate-500 text-xs">
            Mã PIN bảo mật cá nhân (Mặc định: <span class="font-mono text-slate-400 font-bold">1995</span>)
        </div>
    </div>

    <script>
        const pinInput = document.getElementById('pinInput');
        const form = document.getElementById('pinForm');
        const dots = document.querySelectorAll('.pin-dot');
        let currentPin = '';

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });
            pinInput.value = currentPin;

            // Auto submit when 4 digits are entered
            if (currentPin.length === 4) {
                setTimeout(() => {
                    form.submit();
                }, 150);
            }
        }

        function pressKey(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                updateDots();
            }
        }

        function backspacePin() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }

        function clearPin() {
            currentPin = '';
            updateDots();
        }

        // Listen for keyboard input on desktop
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                pressKey(e.key);
            } else if (e.key === 'Backspace') {
                backspacePin();
            } else if (e.key === 'Escape') {
                clearPin();
            } else if (e.key === 'Enter') {
                if (currentPin.length === 4) {
                    form.submit();
                }
            }
        });

        // Shake animation for error
        {% if error %}
        const dotsBox = document.getElementById('dotsContainer');
        dotsBox.classList.add('animate-pulse');
        {% endif %}
    </script>
</body>
</html>
